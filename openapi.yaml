  # =====================================================================
  # Compass conversational API (v2)
  # =====================================================================
  /api/v2/compass:
    post:
      operationId: compassConverse
      tags: [Compass]
      summary: Main Compass conversational endpoint
      description: |
        Unified entry point for all Compass modes (conversation, tutor, quiz_config,
        interview_config, note, insight, mentor, coach, greeting). Dispatches to
        mode-specific logic; all calls carry full user context (objective, plan,
        readiness, mastery). Daily token budget applies for LLM-backed modes.

        The `output` shape is mode-dependent:
        - conversation / mentor / coach: reply + followups + cards (+ optional suggestedAction)
        - greeting: message + suggestedActions
        - quiz_config: headline + config + estimateMin + startEndpoint
        - interview_config: headline + config + startEndpoint
        - insight: headline + items[]
        - note: reply + action (type + endpoints)
        - tutor: reply + followups + contentTitle

        All modes MAY include `suggestedAction` appended by intent detection.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum:
                    - conversation
                    - tutor
                    - quiz_config
                    - interview_config
                    - note
                    - insight
                    - mentor
                    - coach
                    - review_week
                    - greeting
                    - tutor_topic
                    - tutor_result
                    - vision
                payload:
                  type: object
                  properties:
                    message:
                      type: string
                      description: User message text (conversation / tutor / mentor / coach turns)
                    history:
                      type: array
                      description: Recent turn history supplied by the client (optional — server falls back to stored thread)
                      items:
                        type: object
                        required: [role, content]
                        properties:
                          role: { type: string, enum: [user, assistant] }
                          content: { type: string }
                    contentId:
                      type: string
                      description: MongoDB ObjectId of the content item (tutor mode)
                    weekNumber:
                      type: integer
                      description: Plan week override (coach mode)
                    scope:
                      type: string
                      description: Retrospective window (coach mode)
                      enum: [week, month, all_time, topic]
                    topic:
                      type: string
                      description: Topic name for topic-scoped coach sessions
      responses:
        '200':
          description: Compass response (shape varies by mode — see output schema)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [mode, output]
                    properties:
                      mode:
                        type: string
                      output:
                        type: object
                        description: Mode-dependent output. Always present for successful calls.
                        properties:
                          reply:
                            type: string
                            description: Primary text reply (conversation / tutor / mentor / coach / note modes)
                          followups:
                            type: array
                            description: Short follow-up suggestion chips (conversation / tutor / coach modes)
                            items: { type: string }
                          cards:
                            type: array
                            description: Rich answer cards projected from Compass Progress tools
                            items:
                              $ref: '#/components/schemas/CompassCard'
                          message:
                            type: string
                            description: Greeting text (greeting mode)
                          suggestedActions:
                            type: array
                            description: Action chips shown below a greeting (greeting mode)
                            items:
                              type: object
                              properties:
                                id:   { type: string }
                                label: { type: string }
                                mode:  { type: string }
                          headline:
                            type: string
                            description: Section headline (quiz_config / interview_config / insight modes)
                          config:
                            type: object
                            description: Pre-filled quiz or interview configuration (quiz_config / interview_config modes)
                            additionalProperties: true
                          startEndpoint:
                            type: string
                            description: API endpoint the client should call to start the quiz or interview
                          items:
                            type: array
                            description: Insight items (insight mode)
                            items:
                              type: object
                              properties:
                                severity: { type: string, enum: [good, info, warn] }
                                text: { type: string }
                          suggestedAction:
                            type: object
                            description: Intent-detected suggested drill action (all conversational modes, optional)
                            additionalProperties: true
                        additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/compass/thread:
    get:
      operationId: compassGetThread
      tags: [Compass]
      summary: Fetch the active Compass conversation thread
      description: |
        Returns the user's active conversation thread (or creates one). The iOS
        Compass tab calls this on cold-start to restore prior messages. Threads
        auto-roll-over after 12 hours of inactivity so the context window stays
        bounded.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active thread with message history
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [threadId, title, messageCount, lastMessageAt, messages]
                    properties:
                      threadId:
                        type: string
                        description: MongoDB ObjectId of the active thread
                      title:
                        type: string
                        description: Auto-generated title from the first user message
                      messageCount:
                        type: integer
                      lastMessageAt:
                        type: string
                        format: date-time
                      messages:
                        type: array
                        items:
                          type: object
                          required: [role, content]
                          properties:
                            role:
                              type: string
                              enum: [user, assistant]
                            content:
                              type: string
                            mode:
                              type: string
                              description: Compass mode this message was produced under
                            followups:
                              type: array
                              items: { type: string }
                            cards:
                              type: array
                              items:
                                $ref: '#/components/schemas/CompassCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/agent/decisions:
    get:
      operationId: listAgentDecisions
      tags: [AgentDecisions]
      summary: List the caller's agent decisions (default status=pending)
      description: |
        Returns the calling user's AgentDecision rows, most recent first
        (capped at 20). This is the surface the client polls to render
        pending agent proposals as actionable cards.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, accepted, adjusted, rejected, ignored] }
      responses:
        '200':
          description: Decisions for the calling user
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [decisions]
                    properties:
                      decisions:
                        type: array
                        items:
                          type: object
                          description: AgentDecision document (action shape is agentId/decisionType-specific)
                          required: [_id, status]
                          properties:
                            _id: { type: string }
                            agentId: { type: string }
                            decisionType: { type: string }
                            action:
                              type: object
                              additionalProperties: true
                            status:
                              type: string
                              enum: [pending, accepted, adjusted, rejected, ignored]
                            createdAt: { type: string, format: date-time }
                          additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/agent/decisions/{id}/respond:
    post:
      operationId: respondToAgentDecision
      tags: [AgentDecisions]
      summary: Record the user's response to an agent proposal (the feedback loop)
      description: |
        Every Apply / Adjust / Dismiss the client sends for an agent proposal
        lands here and closes the AgentDecision row. accepted/adjusted
        responses also apply the proposal's ops (or the caller-supplied
        adjustedOps) to the user's active plan. 404 when the agent flag
        (compass_actions) is off — house convention: clients treat 404 as
        feature-off.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [accepted, adjusted, rejected] }
                adjustedOps:
                  type: array
                  items: { type: object }
      responses:
        '200':
          description: Response recorded (and ops applied when accepted/adjusted)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [decisionId, status, applied]
                    properties:
                      decisionId: { type: string }
                      status: { type: string, enum: [accepted, adjusted, rejected] }
                      applied: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v2/interview-program:
    post:
      operationId: createInterviewProgram
      tags: [InterviewProgram]
      summary: Start a coached multi-week interview prep program
      description: |
        Creates the caller's active interview-coach program (agentic layer
        #4, flag `interview_coach`). Sessions attach to it as they're graded
        (post-evaluation hook) and computeNextFocus recommends which
        dimension to work on next. One active program per user — 409 when
        one already exists (abandon it first). 404 when the interview_coach
        flag is off — house convention: clients treat 404 as feature-off.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetRole]
              properties:
                targetRole: { type: string }
                targetCompany: { type: string }
                driveDate: { type: string, format: date-time }
                weeks: { type: integer, minimum: 1, description: Program length in weeks; defaults to 4 }
      responses:
        '200':
          description: Program created; returns the shaped active program
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [program]
                    properties:
                      program: { $ref: '#/components/schemas/InterviewProgramView' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: getInterviewProgram
      tags: [InterviewProgram]
      summary: Get the caller's active interview prep program
      description: |
        Returns the caller's active interview-coach program shaped for
        clients (target, week strip, dimension trends, current focus,
        next-session suggestion copy) — or `null` when there is no active
        program. 404 when the interview_coach flag is off.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The active program, or null
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [program]
                    properties:
                      program:
                        oneOf:
                          - { $ref: '#/components/schemas/InterviewProgramView' }
                          - { type: 'null' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/interview-program/abandon:
    post:
      operationId: abandonInterviewProgram
      tags: [InterviewProgram]
      summary: Abandon the caller's active interview prep program
      description: |
        Sets the caller's active program's status to 'abandoned'. Idempotent
        — calling this with no active program (already abandoned, completed,
        or never created) is a safe no-op that still returns 200 with
        `abandoned:false`, not an error. 404 when the interview_coach flag is
        off.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Abandon outcome (idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [abandoned]
                    properties:
                      abandoned: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/proof-journey:
    post:
      operationId: createProofJourney
      tags: [ProofJourney]
      summary: Start a JD-to-published-proof journey
      description: |
        Creates the caller's proof-builder journey (agentic layer #8, flag
        `proof_builder`) from a pasted job description. Extracts a compact
        skill summary (one LLM call) and kicks off capstone generation
        through the existing JD-paste generation entry point in the
        background — the response returns immediately with the freshly
        created journey in `extracting` status; poll GET to watch it advance.
        404 when the proof_builder flag is off.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jdText]
              properties:
                jdText: { type: string, description: Pasted job description text (max ~20k chars) }
      responses:
        '200':
          description: Journey created (background extraction/generation kicked off)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [journey]
                    properties:
                      journey: { $ref: '#/components/schemas/ProofJourneyView' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: getProofJourney
      tags: [ProofJourney]
      summary: Get the caller's latest proof journey
      description: |
        Returns the caller's latest proof-builder journey shaped for clients
        (steps checklist, jdSummary, capstoneRef, proofToken,
        nextProofSuggestion) — or `null` when none exists yet. 404 when the
        proof_builder flag is off.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The latest journey, or null
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [journey]
                    properties:
                      journey:
                        oneOf:
                          - { $ref: '#/components/schemas/ProofJourneyView' }
                          - { type: 'null' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/proof-journey/publish:
    post:
      operationId: publishProofJourney
      tags: [ProofJourney]
      summary: Publish the caller's readiness proof from a graded journey
      description: |
        Guards on the journey being in `publishable` status (409 when it
        isn't — capstone not graded yet) and 404 when the caller has no
        journey at all. On success, calls the existing proof-publish engine,
        stores the returned token, and flips the journey to `published`. 404
        when the proof_builder flag is off.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Proof published; returns the updated journey
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [journey]
                    properties:
                      journey: { $ref: '#/components/schemas/ProofJourneyView' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/institution/assessments/{id}/author-agent:
    post:
      operationId: startAuthorAgentRun
      tags: [AuthorAgent]
      summary: Kick off the author agent's bounded generate -> QA -> repair loop for an assessment
      description: |
        Starts an authorAgentService run (records an AgentDecision row, then
        drives assessmentAuthoringService.authorMcq/regenerateQuestion in the
        background). Returns immediately with a decisionId to poll via
        GET /api/institution/author-agent/runs/{decisionId}. 404 when the
        author_agent flag is off, or when the assessment doesn't exist / isn't
        owned by the caller's institution — house convention: clients treat
        404 as feature-off. 409 when the assessment isn't in an authorable
        state (already released/closed, or MCQ authoring already in flight).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief]
              properties:
                brief: { type: string, description: 'Free-text authoring brief for the agent.' }
      responses:
        '200':
          description: Run queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [decisionId]
                    properties:
                      decisionId: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/institution/author-agent/runs/{decisionId}:
    get:
      operationId: getAuthorAgentRunStatus
      tags: [AuthorAgent]
      summary: Poll an author-agent run's status, log, and result
      description: |
        Institution-scoped read for polling a run started via
        POST /api/institution/assessments/{id}/author-agent. status is
        'generating' until the run's result is finalized (ready/needs_review/failed).
        404 when the author_agent flag is off, or the decision row doesn't
        exist / isn't owned by the caller's institution.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: decisionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [status, runLog, result]
                    properties:
                      status: { type: string, enum: [generating, ready, needs_review, failed] }
                      runLog:
                        type: array
                        items:
                          type: object
                          properties:
                            at: { type: string, format: date-time }
                            msg: { type: string }
                      result:
                        type: object
                        nullable: true
                        description: Final run summary, set once the run leaves 'generating'.
                        properties:
                          status: { type: string, enum: [ready, needs_review, failed] }
                          engine: { type: string, enum: [mcq, interview, capstone, drill] }
                          evidence:
                            type: object
                            additionalProperties: true
                            description: |
                              Per-engine REAL persisted evidence (shape varies by engine — mcq:
                              totalQuestions/regenerated/flaggedIndices/passes; interview:
                              questionCount/rounds/judgeVerdict/judgeScores/lintPassed;
                              capstone/drill: bundleId/bundleStatus/roleTrack/difficulty/
                              language/drillSubtype/humanReviewed).
                          totalQuestions: { type: integer }
                          regenerated: { type: integer }
                          flaggedIndices:
                            type: array
                            items: { type: integer }
                          passes: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/institution/agent/briefs:
    get:
      operationId: listAgentBriefs
      tags: [Agentic]
      summary: List the latest cohort intervention briefs for the caller's institution
      description: |
        interventionAgentService.runWeekly writes one PENDING AgentDecision
        'brief' row per qualifying cohort per week (agentId 'intervention').
        Returns the latest 10 of those rows for the caller's institution,
        optionally filtered to one cohort, shaped for the TPO briefs UI
        (cluster summaries — student counts, evidence, proposed copy — not
        the raw studentId lists). 404 when the intervention flag is off
        (house convention: clients treat 404 as feature-off).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: cohortId
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Latest intervention briefs
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [decisions]
                    properties:
                      decisions:
                        type: array
                        items: { $ref: '#/components/schemas/AgentInterventionBrief' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/institution/agent/briefs/{decisionId}/approve:
    post:
      operationId: approveAgentBrief
      tags: [Agentic]
      summary: Approve some or all clusters of an intervention brief (tpo_head only)
      description: |
        Checker semantics: a tpo_coordinator can view a brief via the list
        endpoint but only tpo_head can approve one. Fires the approved
        clusters' `notify_students` proposedAction to every studentId in
        each approved cluster (per-student try/catch — one bad notification
        never blocks the rest). Approving every cluster on the row closes it
        'accepted'; approving a subset closes it 'adjusted' with
        adjustmentDiff.approvedClusterKeys. 404 when the intervention flag
        is off, the row doesn't exist, or isn't owned by the caller's
        institution. 409 when the row isn't pending (already responded to).
        400 when clusterKeys is missing/empty, or names a cluster key that
        isn't on this row.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: decisionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clusterKeys]
              properties:
                clusterKeys:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: Subset of the brief's cluster keys to approve and execute.
      responses:
        '200':
          description: Brief closed; approved clusters' notifications sent
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [executed, status]
                    properties:
                      executed:
                        type: object
                        required: [notified]
                        properties:
                          notified: { type: integer }
                      status: { type: string, enum: [accepted, adjusted] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/institution/agent/activation:
    get:
      operationId: getAgentActivationFunnel
      tags: [Agentic]
      summary: Read the activation-agent's invite claim funnel for one cohort
      description: |
        Read-only snapshot from activationAgentService.getFunnel: outstanding
        vs claimed invites, claim rate, students who've exhausted their
        reminder cap, and the most recent daily reminder batch's stats.
        cohortId is required. 404 when the activation flag is off (house
        convention: clients treat 404 as feature-off).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: cohortId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Activation funnel snapshot
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data: { $ref: '#/components/schemas/AgentActivationFunnel' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
