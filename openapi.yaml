                currentLevel:           { type: string }
                weeklyCommitHours:      { type: number }
                preferredLearningStyle: { type: string }
                targetDate:             { type: string }
                topicsOfInterest:
                  type: array
                  items: { type: object, additionalProperties: true }
                topicSelfRatings:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/SelfRating' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [userObjectiveId]
                properties:
                  userObjectiveId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

