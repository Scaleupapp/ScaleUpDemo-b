          application/json:
            schema: { $ref: '#/components/schemas/UserObjective' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserObjective' }

  /objectives/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateObjective
      summary: Update an objective
      tags: [Objectives]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserObjective' }
