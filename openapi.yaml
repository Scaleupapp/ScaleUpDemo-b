    put:
      operationId: setPrimaryObjective
      summary: Promote an objective to be the primary one
      tags: [Objectives]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' } } } }

  /objectives/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: activateObjective
