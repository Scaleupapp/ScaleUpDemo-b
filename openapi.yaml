    post:
      operationId: abandonDiagnostic
      summary: Abandon an attempt (3-tier policy based on completion %)
      tags: [Diagnostic]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' } } } }

