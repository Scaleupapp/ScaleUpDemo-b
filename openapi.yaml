  # =====================================================================
  # Diagnostic
  # =====================================================================
  /diagnostic/synthesis:
    get:
      operationId: getDiagnosticSynthesis
      summary: E1 synthesis screen payload (for existing-user re-entry)
      tags: [Diagnostic]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true

  /diagnostic/start:
    post:
      operationId: startDiagnostic
      summary: Start a new diagnostic attempt
      tags: [Diagnostic]
      responses:
        '200':
          description: Attempt created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticAttemptStart' }
        '409': { $ref: '#/components/responses/Conflict' }

  /diagnostic/{attemptId}/self-rating:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitDiagnosticSelfRating
      summary: Submit per-topic self-ratings for an attempt
      tags: [Diagnostic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ratings]
              properties:
                ratings:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/SelfRating' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' } } } }
        '503':
          description: Pool assembly transient failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }

  /diagnostic/{attemptId}/next-question:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDiagnosticNextQuestion
      summary: Fetch the next adaptive question
      tags: [Diagnostic]
      responses:
        '200':
          description: Either a question, or done
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticNextQuestion' }

  /diagnostic/{attemptId}/answer:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitDiagnosticAnswer
      summary: Submit an MCQ answer
      tags: [Diagnostic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, selectedAnswer]
              properties:
                questionId:     { type: string }
                selectedAnswer: { type: string }
                timeTaken:      { type: number, minimum: 0 }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { ack: { const: true } }

  /diagnostic/{attemptId}/finish:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    post:
      operationId: finishDiagnostic
      summary: Finalise the attempt; computes results + insights
      tags: [Diagnostic]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticResults' }

  /diagnostic/{attemptId}/results:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDiagnosticResults
      summary: Fetch results (poll while insights are generating)
      tags: [Diagnostic]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticResults' }

  /diagnostic/{attemptId}/abandon:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    post:
      operationId: abandonDiagnostic
      summary: Abandon an attempt (3-tier policy based on completion %)
      tags: [Diagnostic]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' } } } }

  /diagnostic/recalibration/eligible:
    get:
      operationId: getRecalibrationEligibility
      summary: Check whether the user is eligible for re-calibration
      tags: [Diagnostic]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [eligible]
                        properties:
                          eligible:        { type: boolean }
                          reason:          { type: string }
                          daysSinceLast:   { type: integer }
                          eligibleTopics:
                            type: array
                            items: { type: string }

  /diagnostic/recalibration/start:
    post:
      operationId: startRecalibration
      summary: Start a recalibration attempt
      tags: [Diagnostic]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userFlaggedTopics:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticAttemptStart' }
        '409': { $ref: '#/components/responses/Conflict' }

  /diagnostic/voice/upload:
    post:
      operationId: uploadVoiceAnswer
      summary: Upload a voice-question audio answer (multipart)
      tags: [Diagnostic]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, attemptId, questionId, canonicalCompetency]
              properties:
                audio:                { type: string, format: binary }
                attemptId:            { type: string }
                questionId:           { type: string }
                canonicalCompetency:  { type: string }
      responses:
        '200':
          description: Transcribed + scored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          transcript: { type: string }
                          score:      { type: number }
                          band:       { $ref: '#/components/schemas/ProficiencyBand' }

