      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true

  /diagnostic/start:
    post:
      operationId: startDiagnostic
      summary: Start a new diagnostic attempt
      tags: [Diagnostic]
      responses:
        '200':
          description: Attempt created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticAttemptStart' }
