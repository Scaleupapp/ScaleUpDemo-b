            application/json:
              schema:
                type: object
                required: [userObjectiveId]
                properties:
                  userObjectiveId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =====================================================================
