  # =====================================================================
  # Coding (no /api/v1 version prefix — separate namespace)
  # =====================================================================
  /api/coding/drills/today:
    get:
      operationId: getCodeDrillToday
      tags: [Coding]
      summary: Get the recommended drill for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recommended drill
          content:
            application/json:
              schema:
                type: object
                required: [bundle_id, brief, time_budget_minutes, drill_subtype, difficulty, role_track, language]
                properties:
                  bundle_id:
                    type: string
                  brief:
                    type: string
                  time_budget_minutes:
                    type: integer
                  drill_subtype:
                    type: string
                    enum: [prompt, verify, decompose, refactor]
                  difficulty:
                    type: string
                    enum: [easy, medium, hard]
                  role_track:
                    type: string
                    enum: [swe, ds, ai_eng]
                  language:
                    type: string
                  acceptance_criteria:
                    type: array
                    items:
                      type: string
                  starter_repo:
                    description: Present only for refactor drills; null otherwise
                    oneOf:
                      - type: object
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No drill available, quota used, or user objective does not map to a coding track
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [no_coding_track_for_objective, calibration_required, no_drill_available, daily_quota_used]
                  role_track:
                    type: string
                  difficulty:
                    type: string
                  drill_subtype:
                    type: string
                  next_drill_at:
                    type: string
                    format: date-time
                    description: Present only when error is daily_quota_used
  /api/coding/drills/request:
    post:
      operationId: requestOnDemandDrill
      tags: [Coding]
      summary: Request an on-demand drill (bypasses daily quota)
      description: |
        Creates an on-demand DrillAttempt that bypasses the daily 1-drill quota.
        All body fields are optional. When omitted, `drill_subtype` is chosen from
        the user's weakest mastery axis and `difficulty` from their current
        DifficultyState. Bundles attempted in the last 7 days are excluded (with a
        last-resort fallback that ignores the exclusion list if none remain).
        The attempt is flagged `is_user_requested: true` for analytics.
        Returns the same shape as `startCodeDrill` so iOS can reuse rendering.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              # Note: each property here is optional/nullable — when omitted,
              # backend falls back to (drill_subtype = weakest mastery axis;
              # difficulty = current DifficultyState; topic_hint = case-insensitive
              # match against bundle brief).
              type: object
              properties:
                drill_subtype:
                  oneOf:
                    - type: string
                      enum: [prompt, verify, decompose]
                    - type: 'null'
                difficulty:
                  oneOf:
                    - type: string
                      enum: [easy, medium, hard]
                    - type: 'null'
                topic_hint:
                  oneOf:
                    - type: string
                    - type: 'null'
      responses:
        '200':
          description: On-demand drill started — same safe bundle view as startCodeDrill
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, bundle_id, brief, time_budget_minutes, drill_subtype, difficulty, role_track, language]
                properties:
                  attempt_id:
                    type: string
                  bundle_id:
                    type: string
                  brief:
                    type: string
                  time_budget_minutes:
                    type: integer
                  drill_subtype:
                    type: string
                    enum: [prompt, verify, decompose, refactor]
                  difficulty:
                    type: string
                    enum: [easy, medium, hard]
                  role_track:
                    type: string
                    enum: [swe, ds, ai_eng]
                  language:
                    type: string
                  acceptance_criteria:
                    type: array
                    items:
                      type: string
                  starter_repo:
                    description: Present only for refactor drills
                    oneOf:
                      - type: object
                      - type: 'null'
                  visible_tests:
                    description: Present only for refactor drills
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        command:
                          type: string
        '400':
          description: Invalid drill_subtype or difficulty value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [invalid_drill_subtype, invalid_difficulty]
                  allowed:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No coding objective, or no bundle available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [no_coding_track_for_objective, no_drill_available]
                  role_track:
                    type: string
                  difficulty:
                    type: string
                  drill_subtype:
                    type: string

  /api/coding/drills/{id}/start:
    post:
      operationId: startCodeDrill
      tags: [Coding]
      summary: Start a drill attempt
      description: Creates a DrillAttempt (status=in_progress) and returns the safe bundle view. Enforces daily quota of 1 non-calibration drill per day.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ArtifactBundle _id
      responses:
        '200':
          description: Drill started — safe bundle view returned
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, bundle_id, brief, time_budget_minutes, drill_subtype, difficulty, role_track, language]
                properties:
                  attempt_id:
                    type: string
                  bundle_id:
                    type: string
                  brief:
                    type: string
                  time_budget_minutes:
                    type: integer
                  drill_subtype:
                    type: string
                    enum: [prompt, verify, decompose, refactor]
                  difficulty:
                    type: string
                    enum: [easy, medium, hard]
                  role_track:
                    type: string
                    enum: [swe, ds, ai_eng]
                  language:
                    type: string
                  acceptance_criteria:
                    type: array
                    items:
                      type: string
                  starter_repo:
                    description: Present only for refactor drills
                    oneOf:
                      - type: object
                      - type: 'null'
                  visible_tests:
                    description: Present only for refactor drills; expected_output_contains omitted
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        command:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Bundle not found or not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [bundle_not_found]
        '429':
          description: Daily drill quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [daily_quota_exceeded]
                  limit:
                    type: integer
                    example: 1
  /api/coding/drills/{id}/submit:
    post:
      operationId: submitCodeDrill
      tags: [Coding]
      summary: Submit a drill attempt for grading
      description: Validates submission, marks attempt submitted, enqueues the drill-grader job. Returns 202 with poll URL.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ArtifactBundle _id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drill_subtype, submission]
              properties:
                drill_subtype:
                  type: string
                  enum: [prompt, verify, decompose, refactor]
                submission:
                  type: object
      responses:
        '202':
          description: Submission accepted and enqueued for grading
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, status, poll_url]
                properties:
                  attempt_id:
                    type: string
                  status:
                    type: string
                    enum: [submitted]
                  poll_url:
                    type: string
        '400':
          description: Invalid submission or subtype mismatch
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [invalid_submission, subtype_mismatch]
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Bundle not found or no active attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [bundle_not_found, no_active_attempt]
  /api/coding/drills/{id}/result:
    get:
      operationId: getCodeDrillResult
      tags: [Coding]
      summary: Poll for drill grading result
      description: Returns grade if attempt status is graded, otherwise 202 with current status.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ArtifactBundle _id
      responses:
        '200':
          description: Attempt has been graded
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, status, overall_score, rubric_breakdown, what_to_try_next, integrity_confidence, graded_at, drill_subtype, difficulty, role_track]
                properties:
                  attempt_id:
                    type: string
                  status:
                    type: string
                    enum: [graded]
                  overall_score:
                    type: integer
                    minimum: 0
                    maximum: 100
                  rubric_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        dimension:
                          type: string
                        score:
                          type: integer
                        feedback:
                          type: string
                  what_to_try_next:
                    type: string
                  what_you_missed:
                    type: array
                    items:
                      type: object
                      required: [title, detail]
                      properties:
                        title:
                          type: string
                        detail:
                          type: string
                        reference:
                          oneOf:
                            - type: string
                            - type: 'null'
                  integrity_confidence:
                    type: string
                    enum: [high, medium, low]
                  graded_at:
                    type: string
                    format: date-time
                  drill_subtype:
                    type: string
                    enum: [prompt, verify, decompose, refactor]
                  difficulty:
                    type: string
                    enum: [easy, medium, hard]
                  role_track:
                    type: string
                    enum: [swe, ds, ai_eng]
        '202':
          description: Attempt not yet graded — poll again
          content:
            application/json:
              schema:
                type: object
                required: [status, attempt_id]
                properties:
                  status:
                    type: string
                    enum: [in_progress, submitted]
                  attempt_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No attempt found for this bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [no_attempt_found]

  /api/coding/drills/calibration/start:
    post:
      operationId: startCalibrationDrill
      tags: [Coding]
      summary: Start a calibration drill sequence (4 subtypes, easy difficulty)
      description: |
        Returns 4 easy-difficulty drill bundles, one per subtype (prompt, verify, decompose, refactor),
        bundled as an 8-minute calibration sequence. Each attempt is flagged `is_calibration: true`
        and bypasses the daily quota.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Calibration sequence started
          content:
            application/json:
              schema:
                type: object
                required: [calibration_id, role_track, estimated_minutes, drills]
                properties:
                  calibration_id:
                    type: string
                    format: uuid
                  role_track:
                    type: string
                    enum: [swe, ds, ai_eng]
                  estimated_minutes:
                    type: integer
                    example: 8
                  drills:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items:
                      type: object
                      required: [drill_subtype, attempt_id, bundle_id, brief, time_budget_minutes]
                      properties:
                        drill_subtype:
                          type: string
                          enum: [prompt, verify, decompose, refactor]
                        attempt_id:
                          type: string
                        bundle_id:
                          type: string
                        brief:
                          type: string
                        time_budget_minutes:
                          type: integer
                          example: 2
                        difficulty:
                          type: string
                          enum: [easy]
                        role_track:
                          type: string
                        language:
                          type: string
                        acceptance_criteria:
                          type: array
                          items:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User has no coding objective
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [no_coding_track_for_objective]
        '503':
          description: Not all 4 easy bundles are available yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [calibration_unavailable]
                  missing_subtypes:
                    type: array
                    items:
                      type: string

  /api/coding/drills/calibration/{calibration_id}/submit:
    post:
      operationId: submitCalibrationDrill
      tags: [Coding]
      summary: Submit all 4 calibration drill answers in one payload
      description: |
        Accepts all 4 submissions in a single request. Validates each individually.
        Enqueues 4 drill-grader jobs. Returns 202.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: calibration_id
          required: true
          schema:
            type: string
            format: uuid
          description: The calibration_id returned by the start endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissions]
              properties:
                submissions:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    type: object
                    required: [drill_subtype, attempt_id, submission]
                    properties:
                      drill_subtype:
                        type: string
                        enum: [prompt, verify, decompose, refactor]
                      attempt_id:
                        type: string
                      submission:
                        type: object
      responses:
        '202':
          description: All 4 submissions accepted, grading enqueued
          content:
            application/json:
              schema:
                type: object
                required: [calibration_id, status, poll_url]
                properties:
                  calibration_id:
                    type: string
                  status:
                    type: string
                    enum: [submitted]
                  poll_url:
                    type: string
        '400':
          description: Incomplete or invalid submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [invalid_submission_count, invalid_submission]
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Calibration not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [calibration_not_found]

  /api/coding/drills/calibration/{calibration_id}/result:
    get:
      operationId: getCalibrationDrillResult
      tags: [Coding]
      summary: Poll for calibration aggregate result
      description: |
        Returns aggregate result across all 4 calibration drills.
        When all 4 are graded, also writes baseline to MetaSkillMastery and
        recommended_difficulty to DifficultyState (idempotent via calibration_committed flag).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: calibration_id
          required: true
          schema:
            type: string
            format: uuid
          description: The calibration_id from the start endpoint
      responses:
        '200':
          description: All 4 drills graded — full aggregate result
          content:
            application/json:
              schema:
                type: object
                required: [calibration_id, status, drills, baseline_axes, recommended_difficulty]
                properties:
                  calibration_id:
                    type: string
                  status:
                    type: string
                    enum: [graded]
                  drills:
                    type: array
                    items:
                      type: object
                      properties:
                        drill_subtype:
                          type: string
                          enum: [prompt, verify, decompose, refactor]
                        status:
                          type: string
                          enum: [graded]
                        overall_score:
                          type: integer
                          minimum: 0
                          maximum: 100
                        rubric_breakdown:
                          type: array
                          items:
                            type: object
                  baseline_axes:
                    type: object
                    required: [prompting, verification, decomposition, refactoring]
                    properties:
                      prompting:
                        type: integer
                        minimum: 0
                        maximum: 100
                      verification:
                        type: integer
                        minimum: 0
                        maximum: 100
                      decomposition:
                        type: integer
                        minimum: 0
                        maximum: 100
                      refactoring:
                        type: integer
                        minimum: 0
                        maximum: 100
                  recommended_difficulty:
                    type: string
                    enum: [easy, medium, hard]
        '202':
          description: Grading still in progress
          content:
            application/json:
              schema:
                type: object
                required: [calibration_id, status, drills]
                properties:
                  calibration_id:
                    type: string
                  status:
                    type: string
                    enum: [pending, partial]
                  drills:
                    type: array
                    items:
                      type: object
                      properties:
                        drill_subtype:
                          type: string
                        status:
                          type: string
                        overall_score:
                          oneOf:
                            - type: integer
                            - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Calibration not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [calibration_not_found]

  # =====================================================================
  # Capstones (Phase B)
  # =====================================================================
  /api/coding/capstones/library:
    get:
      operationId: listCapstoneLibrary
      tags: [Coding]
      summary: List capstones the authenticated user can pick
      description: |
        Returns capstones filtered by the user's role-track + difficulty
        recommendation. Each entry marks `already_completed: true` if the
        user has a graded session for that bundle (re-attempts are allowed
        but the UI greys them).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: difficulty
          schema: { type: string, enum: [easy, medium, hard] }
        - in: query
          name: role_track
          schema: { type: string, enum: [swe, ds, ai_eng] }
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema:
                type: object
                required: [capstones]
                properties:
                  capstones:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapstoneLibraryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coding/capstones/summary:
    get:
      operationId: getCapstoneSummary
      tags: [Coding]
      summary: Aggregated coding status for the Compass tab
      description: |
        Returns the learner's coding capstone status snapshot — current
        difficulty, mastery axes, last 5 graded capstones, any in-progress
        session, and the next-available timestamp. Powers the Coding card
        on the Compass tab + the Compass chat's "how am I doing on coding"
        flow.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstoneSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coding/capstones/retry:
    post:
      operationId: retryCapstone
      tags: [Coding]
      summary: Create a fresh session against a previously graded bundle
      description: |
        Starts a new capstone session against a bundle the learner has
        already graded once. Used by the "Try again" CTA on the result
        screen. Refuses if there's already an in-progress session.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapstoneStartRequest'
      responses:
        '201':
          description: Retry session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstoneStartResponse'
        '400':
          description: No prior attempt against this bundle (use /start)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
        '409':
          description: A session is already in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coding/capstones/request:
    post:
      operationId: requestNextCapstone
      tags: [Coding]
      summary: Smart-pick the next best capstone for this learner
      description: |
        "Surprise me" — selects the next capstone based on role-track,
        recalibrated difficulty, and 7-day cadence. Returns the bundle
        (preview-safe — no solution/hidden tests). Client then calls
        /start with the returned bundle_id.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Suggested bundle
          content:
            application/json:
              schema:
                type: object
                required: [bundle, cadence, reason]
                properties:
                  bundle:
                    $ref: '#/components/schemas/CapstoneBundleView'
                  cadence:
                    type: string
                    enum: [weekly]
                  reason:
                    type: string
        '409':
          description: No capstone available right now
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coding/capstones/start:
    post:
      operationId: startCapstone
      tags: [Coding]
      summary: Create a capstone session and mint a pairing code
      description: |
        Creates a new CapstoneSession in `scheduled` state, mints a 6-digit
        pairing code valid for 10 min, and asynchronously requests sandbox
        provisioning. Client polls `/status` until ready, or pairs from
        laptop via `/redeem`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapstoneStartRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstoneStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Bundle not found or not a capstone
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [bundle_not_found, not_a_capstone, no_coding_track_for_objective]

  /api/coding/capstones/redeem:
    post:
      operationId: redeemCapstonePairingCode
      tags: [Coding]
      summary: Redeem a pairing code from the laptop
      description: |
        Laptop posts the 6-digit code (entered manually or scanned from QR).
        Returns the session id + a short-lived WS token + the bundle so the
        web IDE can load the starter repo immediately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapstonePairRequest'
      responses:
        '200':
          description: Paired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstonePairResponse'
        '404':
          description: Code invalid, expired, or already used
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [pairing_code_invalid, pairing_code_expired, pairing_code_used]

  /api/coding/capstones/{session_id}/status:
    get:
      operationId: getCapstoneSessionStatus
      tags: [Coding]
      summary: Poll the session status (used by mobile while waiting for sandbox)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstoneSessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/coding/capstones/{session_id}/control:
    post:
      operationId: controlCapstoneSession
      tags: [Coding]
      summary: Pause / resume / abort / submit a session
      description: |
        Mobile-side control surface (spec §7.3 `session.control`). `submit`
        is also reachable from the web IDE; both routes go through the same
        state machine.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapstoneControlRequest'
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstoneSessionView'
        '409':
          description: Invalid transition for current status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [invalid_transition]
                  current_status:
                    $ref: '#/components/schemas/CapstoneSessionStatus'

  /api/coding/capstones/{session_id}/voice-reflection:
    post:
      operationId: uploadCapstoneVoiceReflection
      tags: [Coding]
      summary: Upload the 60-sec voice reflection (spec §7.2 step 12)
      description: |
        Multipart upload of the audio capture. Backend stores the audio in
        S3, enqueues a transcription job (Whisper), re-runs the evaluator
        in reflection-only mode to update the Reflection-Quality dimension.

        Idempotency: if the session already has a transcript, the call is
        rejected with 409 reflection_already_recorded. Pass `?replace=true`
        to overwrite.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
        - in: query
          name: replace
          required: false
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: audio/* (m4a / mp3 / wav / webm / ogg); max 25 MB
      responses:
        '202':
          description: Accepted — transcription + re-score queued
          content:
            application/json:
              schema:
                type: object
                required: [session_id, queued]
                properties:
                  session_id: { type: string }
                  bytes: { type: integer }
                  queued: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session not graded yet, or reflection already recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [session_not_graded, reflection_already_recorded]
                  current_status: { type: string }
                  message: { type: string }

  /api/coding/capstones/{session_id}/events:
    post:
      operationId: appendCapstoneEvents
      tags: [Coding]
      summary: Append browser-side recording events (web IDE only)
      description: |
        The web IDE's recording client batches events (file_write, tab_blur,
        paste, focus_change, etc.) and posts them here every ~5 s. Backend
        normalises against the recordingService catalogue and persists via
        the same S3 ndjson stream the server-side emissions land in.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum:
                          - file_write
                          - file_read
                          - command_run
                          - test_result
                          - compass_turn
                          - tab_blur
                          - paste
                          - focus_change
                      payload:
                        type: object
      responses:
        '200':
          description: Events accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        '202':
          description: Session in terminal state — events accepted-and-dropped
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
                  reason: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/coding/capstones/{session_id}/run:
    post:
      operationId: runCapstoneCommand
      tags: [Coding]
      summary: Run a shell command in the session sandbox (web IDE terminal)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd]
              properties:
                cmd:
                  type: string
                  minLength: 1
                  maxLength: 4096
      responses:
        '200':
          description: Command output
          content:
            application/json:
              schema:
                type: object
                required: [stdout, stderr, exitCode, durationMs]
                properties:
                  stdout: { type: string }
                  stderr: { type: string }
                  exitCode: { type: integer }
                  durationMs: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session not active or sandbox not provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [session_not_active, sandbox_not_provisioned]

  /api/coding/capstones/{session_id}/files:
    post:
      operationId: persistCapstoneFiles
      tags: [Coding]
      summary: Persist a batch of file edits into the session sandbox
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [path, content]
                    properties:
                      path: { type: string }
                      content: { type: string }
      responses:
        '200':
          description: Files persisted
          content:
            application/json:
              schema:
                type: object
                required: [persisted]
                properties:
                  persisted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session not active or sandbox not provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /api/coding/capstones/{session_id}/result:
    get:
      operationId: getCapstoneResult
      tags: [Coding]
      summary: Get the graded result (returns 202 if still evaluating)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Graded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstoneResult'
        '202':
          description: Still evaluating
          content:
            application/json:
              schema:
                type: object
                required: [session_id, status]
                properties:
                  session_id: { type: string }
                  status:
                    $ref: '#/components/schemas/CapstoneSessionStatus'
                  evaluating_started_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/coding/capstones/{session_id}/replay:
    get:
      operationId: getCapstoneReplay
      tags: [Coding]
      summary: Get the replay index + presigned S3 URLs (spec §7.4)
      description: |
        Returns the event-stream URL and per-snapshot URLs so the mobile and
        web replay scrubbers can render any moment. Raw stream lives in S3
        for 90 days; if a presigned URL has expired, calling this again
        re-issues it.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Replay descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapstoneReplay'
        '404':
          $ref: '#/components/responses/NotFound'

  # =====================================================================
  # Compass-Coder (AI pair-programmer; Phase A chat + Phase B tool-use)
  # =====================================================================
  /api/coding/compass-coder/chat:
    post:
      operationId: compassCoderChat
      tags: [Coding]
      summary: Conversational Compass-Coder turn (no tools)
      description: |
        Used by Phase A Refactor drills. Daily token budget applies.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_history]
              properties:
                session_context:
                  type: object
                  properties:
                    brief: { type: string }
                    language: { type: string }
                    drill_subtype: { type: string }
                    current_files:
                      type: array
                      items:
                        type: object
                        required: [path, content]
                        properties:
                          path: { type: string }
                          content: { type: string }
                message_history:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                max_tokens: { type: integer, default: 2048 }
      responses:
        '200':
          description: Coder reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompassCoderChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coding/compass-coder/turn:
    post:
      operationId: compassCoderTurn
      tags: [Coding]
      summary: Tool-use Compass-Coder turn scoped to a capstone session
      description: |
        Phase B entry point. Coder may invoke read_file / write_file /
        run_command / run_tests against the session sandbox. Returns
        the final assistant text plus the full tool-call trace and a
        prompt_id the client uses with /resolve when the learner closes
        the loop (accept / edit / reject). Daily token budget applies.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, message_history]
              properties:
                session_id: { type: string }
                message_history:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                max_tokens: { type: integer, default: 2048 }
      responses:
        '200':
          description: Coder turn result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompassCoderTurnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/coding/compass-coder/resolve:
    post:
      operationId: compassCoderResolve
      tags: [Coding]
      summary: Report learner's accept/edit/reject for a prior turn
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, prompt_id, resolution]
              properties:
                session_id: { type: string }
                prompt_id: { type: string }
                resolution:
                  type: string
                  enum: [accept, edit, reject]
      responses:
        '204':
          description: Resolution recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coding/compass-coder/budget:
    get:
      operationId: getCompassCoderBudget
      tags: [Coding]
      summary: Current Compass-Coder daily-token-budget usage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                type: object
                required: [used, cap, remaining]
                properties:
                  used: { type: integer }
                  cap: { type: integer }
                  remaining: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =====================================================================
  # Admin / ops dashboards (capstone quality gate — spec §14.2)
  # =====================================================================
  /api/coding/admin/anchor-drift:
    get:
      operationId: getCapstoneAnchorDrift
      tags: [Coding]
      summary: Anchor-drift dashboard (spec §8.3, §14.2 quality gate)
      description: |
        Returns the rolling-window drift rate vs the 5% target plus the
        bundle/anchor pairs that drift most often. Admin-only.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: since_days
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Drift snapshot
          content:
            application/json:
              schema:
                type: object
                required: [window_days, drift_rate, target_rate, target_met, by_bundle_anchor]
                properties:
                  window_days: { type: integer }
                  total_graded: { type: integer }
                  drifted_sessions: { type: integer }
                  drift_rate: { type: number }
                  target_rate: { type: number }
                  target_met: { type: boolean }
                  by_bundle_anchor:
                    type: array
                    items:
                      type: object
                      properties:
                        bundle_id: { type: string }
                        anchor_id: { type: string }
                        observations: { type: integer }
                        mean_drift: { type: number }
                        max_drift: { type: number }
                        last_observed_at: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/coding/admin/human-review:
    get:
      operationId: getCapstoneHumanReviewQueue
      tags: [Coding]
      summary: List bundles flagged for human review (anchor-drift, validator fail)
      description: |
        Each item additionally carries a `dossier` — the latest review_triage
        (Plan 6 #9) evidence pack + advisory recommendation for that item,
        `null` when the agent hasn't produced one yet.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
      responses:
        '200':
          description: Queue snapshot
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/coding/admin/human-review/{id}/resolve:
    post:
      operationId: resolveCapstoneHumanReview
      tags: [Coding]
      summary: Reviewer's approve/reject decision on a human-review item
      description: |
        The one mutating admin-dashboard endpoint. Persists the reviewer's
        real resolution, then closes the item's review_triage dossier
        (Plan 6 #9): agreeing with the agent's recommendation closes it
        `accepted`, overruling it closes it `adjusted`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [approved, rejected]
                notes: { type: string }
      responses:
        '200':
          description: Review item resolved
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { type: object }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

