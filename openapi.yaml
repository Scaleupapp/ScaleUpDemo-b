                          daysSinceLast:   { type: integer }
                          eligibleTopics:
                            type: array
                            items: { type: string }

  /diagnostic/recalibration/start:
    post:
      operationId: startRecalibration
      summary: Start a recalibration attempt
      tags: [Diagnostic]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userFlaggedTopics:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticAttemptStart' }
        '409': { $ref: '#/components/responses/Conflict' }

  /diagnostic/voice/upload:
    post:
      operationId: uploadVoiceAnswer
      summary: Upload a voice-question audio answer (multipart)
