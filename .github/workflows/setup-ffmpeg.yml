name: Install ffmpeg & requeue

on:
  workflow_dispatch:

jobs:
  setup:
    name: Install ffmpeg and requeue stuck content
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg and requeue via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            ffmpeg -version | head -1
            cd /home/${{ secrets.EC2_USER }}/scaleup-backend
            git pull origin master
            node scripts/requeue-stuck-content.js
            sudo systemctl restart scaleup-backend || pm2 restart all || echo "Please restart the server manually"
