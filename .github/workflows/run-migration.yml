name: Run DB Migration

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run (relative to project root)'
        required: false
        default: 'scripts/fix-s3-keys.js'

jobs:
  migrate:
    name: Run script on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Run script via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: cd /home/ubuntu/scaleup-backend && git pull origin master && node ${{ github.event.inputs.script }}
